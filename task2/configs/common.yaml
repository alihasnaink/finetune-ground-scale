# Shared settings for Task 2 (PA3 manual, Section 2). Run configs (vlm196.yaml, vlm49.yaml)
# are deep-merged on top of this file.

seed: 6304

paths:
  out_root: /kaggle/working/task2              # small evidence files (zipped)
  artifacts_root: /kaggle/working/task2_artifacts   # features, checkpoints, stage weights (kept, not zipped)
  scratch_root: /tmp/atml_task2                 # downloads, raw images
  # Extra roots searched for COCO images before downloading them (e.g. an attached Kaggle
  # dataset). Each root may contain train2014/ and val2014/ folders with the original file names.
  coco_image_roots: []
  # Where attached outputs of earlier Task 2 notebooks are mounted (features / checkpoints reuse)
  prior_search: /kaggle/input

sources:
  coco_annotations: http://images.cocodataset.org/annotations/annotations_trainval2014.zip
  coco_image_url: http://images.cocodataset.org/{split}/COCO_{split}_{image_id:012d}.jpg
  vqa_base: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa
  vqa_files:
    - v2_Questions_Train_mscoco.zip
    - v2_Questions_Val_mscoco.zip
    - v2_Annotations_Train_mscoco.zip
    - v2_Annotations_Val_mscoco.zip
    - v2_Complementary_Pairs_Train_mscoco.zip
    - v2_Complementary_Pairs_Val_mscoco.zip
  download_threads: 32

models:
  vision: google/siglip-base-patch16-224
  language: Qwen/Qwen3-0.6B

data:
  caption_train_images: 6000
  captions_per_train_image: 3
  caption_dev_images: 96
  grounding:
    # pools sampled during training (pairs may be drawn repeatedly)
    train_pool_presence: 6000
    train_pool_counting: 6000
    dev_presence: 12            # 24 dev pairs in total
    dev_counting: 12
    test_presence: 32           # 64 test pairs in total
    test_counting: 32
    count_min: 1
    count_max: 4
    # label-quality rules (COCO can omit objects / have ambiguous counts):
    min_instance_area: 1024     # px; "small" objects (< 32x32) make presence/counts ambiguous
    exclude_crowd: true         # images with an iscrowd annotation of the category are not used
  vqa:
    min_agreement: 8            # of 10 annotators, for each image of the pair
    train: {"yes/no": 640, "number": 256, "other": 640}
    dev: {"yes/no": 12, "number": 8, "other": 12}
    test: {"yes/no": 36, "number": 24, "other": 36}
  caption_prompt: "Write a short caption for this image."
  caps:
    question: 80
    caption_target: 64
    answer_target: 16

features:
  batch_size: 64
  thumbnail_px: 256             # small JPEGs of evaluation images for the qualitative figures

model:
  visual_tokens: 196            # 196 = 14x14 patches; 49 = 2x2 average pooled (optional run)
  connector_hidden: 1024
  calibration_images: 512       # training images used to calibrate the connector output scale
  calibration_texts: 2000       # training captions/questions used for the text-embedding norm
  lora: {r: 16, alpha: 32, dropout: 0.05, targets: [q_proj, k_proj, v_proj, o_proj]}

train:
  micro_batch_size: 8
  grad_accum: 2                 # effective batch 16
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  grad_clip: 1.0
  warmup_frac: 0.05
  final_lr_frac: 0.1            # cosine decay to 10% of peak
  gradient_checkpointing: true
  init_loss_scale: 1024.0       # 65536 overflows on the first FP16 updates
  checkpoint_every: 250
  keep_last_checkpoints: 2
  stages:
    - {name: caption_alignment, updates: 2250, connector_lr: 1.0e-3, lora_lr: null,
       mixture: {caption: 1.0}}
    - {name: visual_instruction, updates: 1500, connector_lr: 1.0e-4, lora_lr: 2.0e-5,
       mixture: {presence: 0.5, counting: 0.25, caption: 0.25}}
    - {name: natural_vqa, updates: 750, connector_lr: 5.0e-5, lora_lr: 1.0e-5,
       mixture: {vqa: 0.7, presence: 0.1, counting: 0.1, caption: 0.1}}

dev_eval:
  every: 500
  extra_updates: [2250, 3750, 4500]   # stage endpoints (update 0 = before training is always run)
  batch_size: 16

final_eval:
  batch_size: 8
  max_new_tokens: 16
  bootstrap_resamples: 4000
